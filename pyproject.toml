[project]
name = "momentum"
version = "3.0.0"
description = "Programas das tarefas optativas de PME0100 Mecânica I"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Eduardo Lima Moraes" }]
dependencies = [
    "imageio-ffmpeg>=0.6",
    "matplotlib>=3.11",
    "numpy>=2.4",
    "pygments>=2.21",
    "pypdf>=6.20",
    "reportlab>=5.0",
]

[project.scripts]
momentum = "momentum.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["momentum"]
