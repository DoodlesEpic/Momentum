[project]
name = "momentum"
version = "2.1.1"
description = "Programas das tarefas optativas de PME0100 Mecânica I"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Eduardo Lima Moraes" }]
dependencies = [
    "matplotlib>=3.9",
    "numpy>=2.0",
    "pygments>=2.18",
    "reportlab>=4.2",
]

[project.scripts]
momentum = "momentum.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["momentum"]
