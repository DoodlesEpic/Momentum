posicoes_versores = [20.0, 60.0, 100.0, 140.0, 180.0, 220.0, 260.0, 300.0, 340.0]
# π/60 rad/s
omega = 0.05235987755982988
instantes = [10.0, 20.0, 35.0]
pontos_da_curva = 2000
quadros = 180
quadros_por_segundo = 30
# Animação embutida no PDF, com menos quadros para o arquivo não ficar pesado
quadros_pdf = 90
quadros_por_segundo_pdf = 15
dpi_animacao = 100
# Fração de R ocupada pelo maior vetor desenhado
escala_velocidade = 0.4
