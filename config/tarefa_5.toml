# Configuração da Tarefa Optativa 5.

saida_pdf = "saida/tarefa_5.pdf"
saida_animacao = "saida/tarefa_5_hipocicloide.mp4"
dpi = 200

# Parte 1. Todos os ângulos θ estão em graus. R = 3r é o exemplo do capítulo 3.
[hipocicloide]
raio_aro = 3.0
raio_disco = 1.0
razoes = [3.0, 4.0, 6.0, 2.5]
voltas_maximas = 12
instantaneos = [0.0, 50.0, 110.0, 180.0, 260.0, 330.0]
